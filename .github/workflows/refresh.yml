# Weekly data refresh (free Actions in this public repo; no daily job).
# Moves the pin to Deep Cut's latest facts (data/sources.lock.json), rebuilds
# public/data.json and config.json, and adds encrypted Daily locks so there
# are always 400 days ahead. Existing locks are never rewritten, so a day
# already published stays as it was. Commits to main only if something
# changed, then publishes Pages (a push made with GITHUB_TOKEN starts no
# other workflow).
name: Weekly data refresh
on:
  schedule:
    - cron: '17 7 * * 1'   # Mondays 07:17 UTC, after Deep Cut's 06:41 refresh, before the 9:00 AM ET reset
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/pull-data.mjs --latest
      - run: node scripts/build.mjs
      - run: node --test test/*.test.mjs
      - name: Commit if anything changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data public)" ]; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data public
          git commit -m "Weekly data refresh: $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=1" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.commit.outputs.pushed == '1'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
