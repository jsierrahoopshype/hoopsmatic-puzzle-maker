# Publishes public/ (the page, core.js, data.json, config.json, fonts and the
# encrypted Daily locks) to GitHub Pages, served at
# https://hoopsmatic.com/puzzle-maker/ by hoopsmatic-worker. Runs on merges
# that touch public/ and by hand. Free (public repo); no schedule.
name: Pages
on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: d
        uses: actions/deploy-pages@v4
